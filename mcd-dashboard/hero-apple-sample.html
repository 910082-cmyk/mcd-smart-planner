<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦麦智配 · Apple 风格 Hero 样品</title>
<style>
/* ============ 主题令牌：默认浅色；勾选开关 → 深色（纯 CSS，无需 JS） ============ */
.page{
  --bg-grad:linear-gradient(180deg,#FCFBF9 0%,#F5F1E8 100%);
  --ink:#1D1D1F; --gray:#6E6E73; --ter:#86868B;
  --accent:#DA291C; --gold:#F0A800;
  --hair:rgba(0,0,0,.09);
  --bar-bg:rgba(255,255,255,.72); --bar-bd:rgba(0,0,0,.07);
  --pill-bg:rgba(255,255,255,.65); --pill-bd:rgba(0,0,0,.08);
  --btn-bg:rgba(0,0,0,.05); --btn-bd:rgba(0,0,0,.08);
  --glow:radial-gradient(42% 46% at 62% 52%,rgba(255,199,44,.20) 0%,rgba(255,199,44,0) 70%);
  --stage:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.07) 0%,rgba(0,0,0,0) 70%);
  --ao:rgba(0,0,0,.10);
  color-scheme:light;
}
.sw:checked ~ .page{
  --bg-grad:linear-gradient(180deg,#0B0B0C 0%,#000 100%);
  --ink:#F5F5F7; --gray:#A1A1A6; --ter:#86868B;
  --hair:rgba(255,255,255,.13);
  --bar-bg:rgba(28,28,30,.72); --bar-bd:rgba(255,255,255,.1);
  --pill-bg:rgba(255,255,255,.07); --pill-bd:rgba(255,255,255,.12);
  --btn-bg:rgba(255,255,255,.08); --btn-bd:rgba(255,255,255,.14);
  --glow:radial-gradient(42% 46% at 62% 52%,rgba(255,199,44,.16) 0%,rgba(255,199,44,0) 70%);
  --stage:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 70%);
  --ao:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#F5F1E8;overflow-x:hidden}
.page,.page *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease}
.page{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg-grad);color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* 隐藏的真 checkbox（保留可聚焦与键盘操作） */
.sw{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
/* ============ 悬浮玻璃工具条 ============ */
.bar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:12px;padding:7px 8px 7px 15px;
  background:var(--bar-bg);border:1px solid var(--bar-bd);border-radius:999px;
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:0 8px 30px rgba(0,0,0,.08)}
.bar .m{width:21px;height:21px;flex:none}
.bar .bt{font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bar .sep{width:1px;height:18px;background:var(--hair)}
/* 主题开关（label 驱动 checkbox，纯 CSS） */
.swbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--btn-bd);
  background:var(--btn-bg);color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.25s;flex:none;position:relative}
.swbtn:hover{color:var(--accent)}
.swbtn:active{transform:scale(.9)}
.swbtn svg{width:16px;height:16px;position:absolute}
.swbtn .i-moon{display:none}
.sw:checked ~ .page .swbtn .i-sun{display:none}
.sw:checked ~ .page .swbtn .i-moon{display:block}
.sw:focus-visible ~ .page .swbtn{outline:3px solid var(--accent);outline-offset:3px}
/* ============ Hero ============ */
.hero{max-width:1180px;margin:0 auto;padding:132px 32px 88px;
  display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center;min-height:640px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
  letter-spacing:.14em;color:var(--accent);margin-bottom:20px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
h1{font-size:clamp(46px,6.2vw,76px);font-weight:800;letter-spacing:-.035em;line-height:1.04;
  margin-bottom:16px}
.sub{font-size:clamp(17px,1.8vw,21px);color:var(--gray);letter-spacing:-.01em;line-height:1.5;margin-bottom:14px}
.meta{font-size:13.5px;color:var(--ter);line-height:1.7;margin-bottom:38px;max-width:30em}
.meta code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--btn-bg);border-radius:6px;padding:2px 7px;color:var(--gray)}
/* 数据行：细发丝分隔线 */
.stats{display:flex;flex-wrap:wrap;margin-bottom:36px}
.stat{padding:0 26px}
.stat:first-child{padding-left:0}
.stat+.stat{border-left:1px solid var(--hair)}
.stat .v{font-size:clamp(27px,2.6vw,35px);font-weight:700;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums;margin-bottom:7px}
.stat .l{font-size:12.5px;font-weight:600;color:var(--ter);letter-spacing:.02em}
/* 玻璃药丸标签 */
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--gray);
  background:var(--pill-bg);border:1px solid var(--pill-bd);border-radius:999px;padding:7px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.25s}
.pill:hover{color:var(--ink);transform:translateY(-1px)}
.pill .ic{width:13px;height:13px;color:var(--gold)}
/* ============ 金拱门 · 3D 产品级展示 ============ */
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:400px;
  perspective:1000px}
.stage::before{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none}
.arch-float{position:relative;animation:float 7s ease-in-out infinite;transform-style:preserve-3d}
.arch-3d{position:relative;transform:rotateX(5deg) rotateY(-9deg);transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.22,.61,.36,1)}
.stage:hover .arch-3d{transform:rotateX(2deg) rotateY(-4deg) scale(1.035)}
.arch-3d svg{width:clamp(200px,24vw,300px);height:auto;display:block}
/* 地面接触阴影 */
.stage::after{content:"";position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  width:44%;height:30px;border-radius:50%;background:var(--stage);
  box-shadow:0 18px 42px var(--ao);pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
/* ============ 页脚说明 ============ */
.note{max-width:1180px;margin:0 auto;padding:0 32px 40px;font-size:12px;color:var(--ter);
  display:flex;align-items:center;gap:8px}
.note .sq{width:6px;height:6px;border-radius:2px;background:var(--gold);flex:none}
/* ============ 响应式 ============ */
@media(max-width:900px){
  .hero{grid-template-columns:1fr;padding:112px 24px 64px;min-height:0;gap:8px;text-align:left}
  .stage{min-height:300px;margin-top:12px}
  .stat{padding:0 18px}
  .arch-3d{transform:rotateX(4deg) rotateY(-6deg)}
}
@media(prefers-reduced-motion:reduce){
  .arch-float{animation:none}
  .page,.page *{transition:none!important}
}
</style>
</head>
<body>
<!-- 纯 CSS 主题开关：checkbox 在前，.page 为其后继兄弟节点 -->
<input type="checkbox" id="themeSw" class="sw" aria-label="切换深色 / 浅色主题">

<div class="page">
  <div class="bar">
    <svg class="m" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD85E"/><stop offset="1" stop-color="#F0A800"/></linearGradient></defs>
      <path fill="url(#mg)" d="M17.243 3.006c2.066 0 3.742 8.714 3.742 19.478H24c0-11.588-3.042-20.968-6.766-20.968-2.127 0-4.007 2.81-5.248 7.227-1.241-4.416-3.121-7.227-5.231-7.227C3.031 1.516 0 10.888 0 22.476h3.014c0-10.763 1.658-19.47 3.724-19.47 2.066 0 3.741 8.05 3.741 17.98h2.997c0-9.93 1.684-17.98 3.75-17.98Z"/>
    </svg>
    <span class="bt">麦麦智配</span>
    <span class="sep"></span>
    <label class="swbtn" for="themeSw" title="切换深色 / 浅色">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
    </label>
  </div>

  <section class="hero">
    <div class="hero-tx">
      <div class="eyebrow"><span class="dot"></span>M-CODE 2026 · 参赛作品</div>
      <h1>麦麦智配</h1>
      <p class="sub">热量 · 配餐 · 优惠 · 点单<br>一站式决策助手</p>
      <p class="meta">全部数据来自麦当劳 <code>MCP Server</code> 官方接口 · 菜单顺序与门店实时售价严格同步</p>
      <div class="stats">
        <div class="stat"><div class="v">121</div><div class="l">在售餐品</div></div>
        <div class="stat"><div class="v">61</div><div class="l">营养条目</div></div>
        <div class="stat"><div class="v">5</div><div class="l">长沙门店</div></div>
        <div class="stat"><div class="v">35</div><div class="l">MCP 工具</div></div>
      </div>
      <div class="pills">
        <span class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>3D 金拱门 · Three.js</span>
        <span class="pill"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z"/></svg>MCP Server 实时数据</span>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="arch-float">
        <div class="arch-3d" id="arch3d">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="麦当劳金拱门 3D">
            <defs>
              <!-- 主体金色渐变：左上受光 → 右下暗部 -->
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFD94F"/><stop offset=".32" stop-color="#FFC72C"/>
                <stop offset=".72" stop-color="#F0A800"/><stop offset="1" stop-color="#C67E00"/>
              </linearGradient>
              <!-- 挤出层：侧面暗金，伪 3D 厚度 -->
              <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#B87A00"/><stop offset="1" stop-color="#7A5200"/>
              </linearGradient>
              <!-- 镜面高光 -->
              <radialGradient id="spec" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </radialGradient>
              <!-- 左侧轮廓受光 -->
              <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <!-- 右侧体积暗部 -->
              <linearGradient id="vol" x1="0" y1="0" x2="1" y2="0">
                <stop offset=".38" stop-color="#8A5B00" stop-opacity="0"/><stop offset="1" stop-color="#8A5B00" stop-opacity=".42"/>
              </linearGradient>
              <clipPath id="archClip">
                <path d="M17.243 3.006c2.066 0 3.742 8.714 3.742 19.478H24c0-11.588-3.042-20.968-6.766-20.968-2.127 0-4.007 2.81-5.248 7.227-1.241-4.416-3.121-7.227-5.231-7.227C3.031 1.516 0 10.888 0 22.476h3.014c0-10.763 1.658-19.47 3.724-19.47 2.066 0 3.741 8.05 3.741 17.98h2.997c0-9.93 1.684-17.98 3.75-17.98Z"/>
              </clipPath>
              <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="1.1"/>
              </filter>
            </defs>
            <!-- 挤出暗层（向右下偏移，营造厚度） -->
            <path fill="url(#goldSide)" transform="translate(1.2,2.5)" filter="url(#soft)"
              d="M17.243 3.006c2.066 0 3.742 8.714 3.742 19.478H24c0-11.588-3.042-20.968-6.766-20.968-2.127 0-4.007 2.81-5.248 7.227-1.241-4.416-3.121-7.227-5.231-7.227C3.031 1.516 0 10.888 0 22.476h3.014c0-10.763 1.658-19.47 3.724-19.47 2.066 0 3.741 8.05 3.741 17.98h2.997c0-9.93 1.684-17.98 3.75-17.98Z"/>
            <!-- 主体 -->
            <path fill="url(#gold)"
              d="M17.243 3.006c2.066 0 3.742 8.714 3.742 19.478H24c0-11.588-3.042-20.968-6.766-20.968-2.127 0-4.007 2.81-5.248 7.227-1.241-4.416-3.121-7.227-5.231-7.227C3.031 1.516 0 10.888 0 22.476h3.014c0-10.763 1.658-19.47 3.724-19.47 2.066 0 3.741 8.05 3.741 17.98h2.997c0-9.93 1.684-17.98 3.75-17.98Z"/>
            <g clip-path="url(#archClip)">
              <!-- 左侧轮廓受光 -->
              <rect x="0" y="0" width="3.4" height="24" fill="url(#rim)"/>
              <!-- 双拱顶镜面高光 -->
              <ellipse cx="5.6" cy="5.2" rx="2.4" ry="1.1" fill="url(#spec)"/>
              <ellipse cx="18.4" cy="5.2" rx="2.4" ry="1.1" fill="url(#spec)"/>
              <!-- 右侧体积暗部：增强立体感 -->
              <rect x="0" y="0" width="24" height="24" fill="url(#vol)"/>
              <!-- 底部环境光遮蔽 -->
              <ellipse cx="12" cy="23.5" rx="17" ry="4" fill="#8A5B00" opacity=".33"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <div class="note"><span class="sq"></span>Apple 风格样品 · 浅色 / 深色切换（纯 CSS，任何环境可用）· 金拱门 3D 体积光效 · 确认方向后再合入主文件</div>
</div>

<script>
/* 可选增强：鼠标视差微倾斜。脚本不可用（如沙箱预览）时自动降级为 CSS 静态 3D */
(function(){
  try{
    var stage=document.getElementById('stage'),arch=document.getElementById('arch3d');
    if(!stage||!arch||!matchMedia('(hover:hover)').matches)return;
    stage.addEventListener('mousemove',function(e){
      var r=stage.getBoundingClientRect();
      var px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      arch.style.transform='rotateX('+(5-py*7)+'deg) rotateY('+(-9+px*10)+'deg) scale(1.02)';
    });
    stage.addEventListener('mouseleave',function(){arch.style.transform=''});
  }catch(e){}
})();
</script>
</body>
</html>
